# Dados dos candidatos do ranking (versões geradas). Lido por calcular_ranking.py.
#
# Todo número tem `tipo`:
#   documentado — fabricante, loja ou medição publicada (fonte e data na linha);
#   medido      — proxy medido no projeto em x86_64 (versoes/ranking/medicoes/*.json);
#   estimado    — conta com premissa explícita (a premissa está na linha).
# Coleta documental: 20–21/10/2026. Fontes completas em versoes/ranking/fontes/.

cenario:
  bateria_wh: 74.0          # power bank 20 000 mAh × 3,7 V (o mesmo pacote para todos)
  fator_utilizavel: 1.0
  eficiencia: 0.85          # conversão até a placa (mesmo η do exemplo da seção 7)
  eventos_por_dia: 100      # central; sensibilidade 10 e 1000
  sensibilidade_eventos: [10, 1000]
  horizonte_dias: 730       # TCO em 2 anos
  custo_visita_rs: 50.0     # premissa do TCO: cada troca/recarga de bateria = uma visita
  sensibilidade_visita_rs: [20.0, 200.0]
  escrita_s: 0.2            # gravação dos JPEG da rajada (premissa)

cambio:
  usd_brl: 5.2132
  fonte: "PTAX venda de 28/09/2026 (Banco Central) — a mais recente encontrada na coleta"

importacao:
  frete_usd: 10.0           # premissa por pedido internacional
  icms: 0.17                # SP; 20% em AC, AL, BA, CE, MG, PB, PI, RN, RR, SE
  regra: >-
    Remessa Conforme desde 12/05/2026 (MP 1.357/2026, Lei 15.502/2026): II 0% até US$ 50;
    60% menos US$ 30 de US$ 50,01 a US$ 3.000; ICMS por dentro. Supõe plataforma certificada.
  fonte: "Receita Federal, Tributação e Manual de Encomendas Internacionais (atualizados em set/2026)"

